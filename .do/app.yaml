name: agentic-seo
region: fra
services:
  - name: api
    github:
      repo: dalroot/agentic-seo
      branch: master
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
