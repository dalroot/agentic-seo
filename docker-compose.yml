services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dalroot/agentic-seo:latest
    container_name: agentic-seo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./docs/reports:/app/docs/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
